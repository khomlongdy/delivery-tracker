<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Tracker</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-500: #3b82f6;
            --brand-600: #2563eb;
            --brand-700: #1d4ed8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #f6f8fb;
            --bg-elevated: #ffffff;
            --bg-sunken: #eef2f7;
            --surface-glass: rgba(255, 255, 255, 0.92);
            --border: #e5eaf1;
            --text-primary: #0a1628;
            --text-secondary: #4a5568;
            --text-tertiary: #8896a8;
            --shadow-sm: 0 1px 3px rgba(10, 22, 40, 0.04);
            --shadow-md: 0 4px 16px rgba(10, 22, 40, 0.08);
            --shadow-lg: 0 12px 32px rgba(10, 22, 40, 0.12);
            --shadow-xl: 0 24px 64px rgba(10, 22, 40, 0.16);
            --shadow-brand: 0 6px 20px rgba(37, 99, 235, 0.25);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-full: 9999px;
            --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body.dark {
            --bg: #070c16;
            --bg-elevated: #0f172a;
            --bg-sunken: #0a1220;
            --surface-glass: rgba(15, 23, 42, 0.92);
            --border: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-tertiary: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }

        body {
            font-family: 'Kantumruy Pro', 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        button { font-family: inherit; cursor: pointer; border: none; background: none; }

        #map { position: fixed; inset: 0; background: var(--bg-sunken); z-index: 1; }

        .leaflet-control-zoom {
            border: none !important;
            box-shadow: var(--shadow-md) !important;
            border-radius: var(--radius-md) !important;
            overflow: hidden;
            margin-left: 24px !important;
            margin-bottom: 24px !important;
        }

        .leaflet-control-zoom a {
            background: var(--bg-elevated) !important;
            color: var(--text-primary) !important;
            border: none !important;
            width: 40px !important;
            height: 40px !important;
            line-height: 40px !important;
            font-size: 18px !important;
        }

        .leaflet-control-zoom a:hover { background: var(--brand-500) !important; color: white !important; }
        .leaflet-control-zoom a:first-child { border-bottom: 1px solid var(--border) !important; }
        .leaflet-control-attribution { display: none !important; }

        /* ============================================
           UI LAYER
           ============================================ */
        .ui-layer {
            position: fixed;
            inset: 0;
            z-index: 1000;
            pointer-events: none;
            display: grid;
            grid-template-columns: 360px 1fr 360px;
            grid-template-rows: auto 1fr auto;
            gap: 16px;
            padding: 20px;
        }

        .ui-layer > * { pointer-events: auto; }

        .area-topleft { grid-column: 1; grid-row: 1; }

        .logo-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 18px 10px 10px;
            background: var(--surface-glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            width: fit-content;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .logo-mark {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-brand);
        }

        .logo-mark svg { width: 22px; height: 22px; color: white; }
        .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
        .logo-title { font-size: 14px; font-weight: 700; }
        .logo-subtitle { font-size: 11px; font-weight: 500; color: var(--text-tertiary); margin-top: 2px; }

        /* ============================================
           TOP CENTER: STATS
           ============================================ */
        .area-topcenter {
            grid-column: 2;
            grid-row: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .stats-row { display: flex; gap: 10px; }

        .stat-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: var(--surface-glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            min-width: 130px;
            transition: all 250ms var(--ease-out);
        }

        .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }

        .stat-icon {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .stat-icon svg { width: 17px; height: 17px; }
        .stat-content { display: flex; flex-direction: column; line-height: 1.2; }
        .stat-label { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-tertiary); margin-bottom: 1px; }
        .stat-value { font-size: 18px; font-weight: 800; font-family: 'Inter', sans-serif; }

        .stat-card.total .stat-icon { background: rgba(59, 130, 246, 0.15); color: var(--brand-600); }
        .stat-card.online .stat-icon { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .stat-card.offline .stat-icon { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

        /* ============================================
           TOP RIGHT: STATUS
           ============================================ */
        .area-topright {
            grid-column: 3;
            grid-row: 1;
            display: flex;
            justify-content: flex-end;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 16px;
            background: var(--surface-glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            font-size: 12px;
            font-weight: 600;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; position: relative; }
        .status-pill.online { color: var(--success); }
        .status-pill.online .status-dot { background: var(--success); }
        .status-pill.online .status-dot::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: var(--success);
            opacity: 0.4;
            animation: ripple 2s var(--ease-out) infinite;
        }
        .status-pill.offline { color: var(--danger); }
        .status-pill.offline .status-dot { background: var(--danger); }

        @keyframes ripple {
            0% { transform: scale(0.8); opacity: 0.6; }
            100% { transform: scale(2.5); opacity: 0; }
        }

        /* ============================================
           LEFT: VEHICLE LIST (STANDARD DESIGN)
           ============================================ */
        .area-left {
            grid-column: 1;
            grid-row: 2;
            align-self: start;
            max-height: 100%;
        }

        .vehicle-panel {
            background: var(--surface-glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            max-height: 100%;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .panel-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 700;
        }

        .panel-title-icon {
            width: 30px;
            height: 30px;
            border-radius: var(--radius-sm);
            background: rgba(59, 130, 246, 0.15);
            color: var(--brand-600);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .panel-title-icon svg { width: 15px; height: 15px; }

        .vehicle-count-badge {
            padding: 4px 10px;
            background: var(--brand-500);
            color: white;
            border-radius: var(--radius-full);
            font-size: 11px;
            font-weight: 700;
            min-width: 26px;
            text-align: center;
        }

        /* Search Input Area */
        .vehicle-search-box {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .vehicle-search-input {
            width: 100%;
            padding: 8px 12px;
            background: var(--bg-sunken);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .vehicle-search-input:focus {
            border-color: var(--brand-500);
        }

        .vehicle-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .vehicle-list::-webkit-scrollbar { width: 4px; }
        .vehicle-list::-webkit-scrollbar-track { background: transparent; }
        .vehicle-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* ============ VEHICLE CARD - STANDARD ============ */
        .vehicle-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 14px;
            background: var(--bg-elevated);
            border: 1.5px solid transparent;
            border-radius: var(--radius-md);
            margin-bottom: 6px;
            cursor: pointer;
            transition: all 200ms var(--ease-out);
            position: relative;
        }

        .vehicle-card:hover {
            background: var(--bg-sunken);
            border-color: var(--border);
            transform: translateX(2px);
        }

        .vehicle-card.selected {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.08), rgba(59, 130, 246, 0.02));
            border-color: var(--brand-500);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
        }

        /* Left Color Bar */
        .vehicle-card-bar {
            width: 4px;
            height: 40px;
            border-radius: 2px;
            flex-shrink: 0;
            background: var(--vehicle-color, var(--brand-500));
            transition: all 200ms var(--ease-out);
        }

        .vehicle-card.selected .vehicle-card-bar {
            height: 48px;
        }

        /* Vehicle Icon */
        .vehicle-card-icon {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            position: relative;
            background: var(--bg-sunken);
        }

        .vehicle-card-icon::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2.5px solid var(--bg-elevated);
        }

        .vehicle-card-icon.online::after { background: var(--success); }
        .vehicle-card-icon.offline::after { background: var(--danger); }

        /* Vehicle Info */
        .vehicle-card-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .vehicle-card-name-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .vehicle-card-name {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .vehicle-card-status {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 2px 6px;
            border-radius: var(--radius-full);
            flex-shrink: 0;
        }

        .vehicle-card-status.online {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .vehicle-card-status.offline {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        .vehicle-card-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 10px;
            color: var(--text-tertiary);
            font-weight: 600;
        }

        .vehicle-card-meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .vehicle-card-meta-item svg {
            width: 10px;
            height: 10px;
        }

        .vehicle-card-meta-item.distance {
            color: var(--brand-600);
        }

        /* Right Arrow */
        .vehicle-card-arrow {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-tertiary);
            flex-shrink: 0;
            transition: all 200ms var(--ease-out);
        }

        .vehicle-card-arrow svg {
            width: 14px;
            height: 14px;
        }

        .vehicle-card:hover .vehicle-card-arrow {
            background: var(--brand-500);
            color: white;
            transform: translateX(2px);
        }

        .vehicle-card.selected .vehicle-card-arrow {
            background: var(--brand-500);
            color: white;
        }

        /* ============================================
           RIGHT: NOTIFICATIONS
           ============================================ */
        .area-right {
            grid-column: 3;
            grid-row: 2;
            align-self: start;
        }

        .notifications-stack { display: flex; flex-direction: column; gap: 10px; }

        .toast {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px;
            background: var(--surface-glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            animation: toastIn 400ms var(--ease-spring);
            position: relative;
            overflow: hidden;
        }

        .toast::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: var(--brand-500);
        }

        .toast.success::before { background: var(--success); }
        .toast.warning::before { background: var(--warning); }
        .toast.danger::before { background: var(--danger); }

        .toast-icon {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: rgba(59, 130, 246, 0.15);
            color: var(--brand-600);
        }

        .toast.success .toast-icon { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .toast.warning .toast-icon { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .toast.danger .toast-icon { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

        .toast-icon svg { width: 16px; height: 16px; }
        .toast-content { flex: 1; min-width: 0; }
        .toast-title { font-size: 12px; font-weight: 700; margin-bottom: 2px; }
        .toast-message { font-size: 11px; color: var(--text-secondary); line-height: 1.5; }
        .toast-time { font-size: 9px; font-weight: 600; color: var(--text-tertiary); margin-top: 4px; }

        @keyframes toastIn {
            from { transform: translateX(120%) scale(0.9); opacity: 0; }
            to { transform: translateX(0) scale(1); opacity: 1; }
        }

        /* ============================================
           BOTTOM LEFT: HISTORY PANEL
           ============================================ */
        .area-bottomleft { grid-column: 1; grid-row: 3; }

        .history-panel {
            width: 360px;
            max-height: 50vh;
            background: var(--surface-glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            display: none;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .history-panel.show { display: flex; animation: panelIn 400ms var(--ease-spring); }

        @keyframes panelIn {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .panel-body { flex: 1; overflow-y: auto; padding: 16px; }
        .panel-body::-webkit-scrollbar { width: 4px; }
        .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .section-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-tertiary);
            margin-bottom: 10px;
        }

        .section-label svg { width: 13px; height: 13px; }

        .journey-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
            max-height: 180px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .journey-list::-webkit-scrollbar { width: 3px; }
        .journey-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .journey-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 200ms var(--ease-out);
        }

        .journey-item:hover { border-color: var(--brand-500); transform: translateX(4px); }

        .journey-route { flex: 1; min-width: 0; }
        .journey-endpoint { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; margin-bottom: 3px; }
        .endpoint-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .endpoint-dot.start { background: var(--success); }
        .endpoint-dot.end { background: var(--danger); }
        .journey-coords { font-size: 10px; color: var(--text-secondary); font-family: 'Inter', monospace; }
        .journey-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }

        .meta-chip {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            padding: 2px 6px;
            background: var(--bg-sunken);
            border-radius: var(--radius-full);
            font-size: 9px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .meta-chip svg { width: 9px; height: 9px; }

        .playback-section { padding-top: 14px; border-top: 1px solid var(--border); }
        .slider-wrapper { padding: 6px 0 12px; }

        .slider {
            width: 100%;
            -webkit-appearance: none;
            height: 5px;
            background: var(--bg-sunken);
            border-radius: var(--radius-full);
            outline: none;
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
            border-radius: 50%;
            border: 3px solid var(--bg-elevated);
            cursor: pointer;
            box-shadow: var(--shadow-brand);
        }

        .playback-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .mini-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 6px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
        }

        .mini-stat-icon {
            width: 28px;
            height: 28px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mini-stat-icon svg { width: 14px; height: 14px; }

        .mini-stat.speed .mini-stat-icon { background: rgba(59, 130, 246, 0.15); color: var(--brand-600); }
        .mini-stat.battery .mini-stat-icon { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .mini-stat.satellites .mini-stat-icon { background: rgba(245, 158, 11, 0.15); color: var(--warning); }

        .mini-stat-value { font-size: 13px; font-weight: 800; font-family: 'Inter', sans-serif; }
        .mini-stat-label { font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-tertiary); }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            text-align: center;
        }

        .empty-state-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-lg);
            background: var(--bg-sunken);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            color: var(--text-tertiary);
        }

        .empty-state-icon svg { width: 22px; height: 22px; }
        .empty-state-title { font-size: 12px; font-weight: 700; margin-bottom: 3px; }
        .empty-state-text { font-size: 11px; color: var(--text-tertiary); }

        /* ============================================
           BOTTOM RIGHT: CONTROLS
           ============================================ */
        .area-bottomright {
            grid-column: 3;
            grid-row: 3;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
        }

        .floating-controls { display: flex; flex-direction: column; gap: 10px; }

        .fab {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-lg);
            background: var(--surface-glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            transition: all 250ms var(--ease-out);
        }

        .fab svg { width: 20px; height: 20px; }
        .fab:hover { transform: translateY(-3px) scale(1.05); box-shadow: var(--shadow-lg); }

        .fab.active {
            background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
            color: white;
            border-color: transparent;
            box-shadow: var(--shadow-brand);
        }

        /* ============================================
           POPUP
           ============================================ */
        .leaflet-popup-content-wrapper {
            border-radius: var(--radius-lg) !important;
            padding: 0 !important;
            box-shadow: var(--shadow-xl) !important;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--bg-elevated) !important;
        }

        .leaflet-popup-content {
            margin: 0 !important;
            padding: 0 !important;
            min-width: 300px !important;
            max-width: 340px !important;
            font-family: 'Kantumruy Pro', sans-serif !important;
        }

        .leaflet-popup-close-button {
            width: 30px !important;
            height: 30px !important;
            color: white !important;
            font-size: 20px !important;
            line-height: 30px !important;
            top: 8px !important;
            right: 8px !important;
            z-index: 10 !important;
            background: rgba(0,0,0,0.2) !important;
            border-radius: 50% !important;
        }

        .popup-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 20px;
            color: white;
        }

        .popup-header-icon {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .popup-header-icon svg { width: 22px; height: 22px; }
        .popup-header-text { flex: 1; min-width: 0; }
        .popup-title { font-size: 15px; font-weight: 700; margin-bottom: 2px; }

        .popup-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(255,255,255,0.2);
            padding: 3px 10px;
            border-radius: var(--radius-full);
        }

        .popup-status-dot { width: 6px; height: 6px; border-radius: 50%; }
        .popup-body { padding: 16px 20px; }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .info-tile {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 10px 12px;
            background: var(--bg-sunken);
            border-radius: var(--radius-sm);
        }

        .info-tile-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .info-tile-label svg { width: 11px; height: 11px; }
        .info-tile-value { font-size: 12px; font-weight: 700; font-family: 'Inter', monospace; }

        .popup-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }

        .popup-section-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-tertiary);
            margin-bottom: 8px;
        }

        .popup-section-title svg { width: 12px; height: 12px; }

        .popup-journey {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 10px 12px;
            background: var(--bg-sunken);
            border-radius: var(--radius-sm);
            margin-bottom: 6px;
            border-left: 3px solid var(--brand-500);
        }

        .popup-journey-route { font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
        .popup-journey-meta { font-size: 10px; color: var(--text-tertiary); font-weight: 600; display: flex; align-items: center; gap: 8px; }

        .popup-footer {
            padding: 10px 20px;
            background: var(--bg-sunken);
            font-size: 10px;
            font-weight: 600;
            color: var(--text-tertiary);
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .popup-footer svg { width: 11px; height: 11px; }

        .car-marker div {
            transition: transform 600ms cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 1200px) {
            .ui-layer {
                grid-template-columns: 320px 1fr 320px;
                gap: 12px;
                padding: 16px;
            }
            .history-panel { width: 320px; }
        }

        @media (max-width: 900px) {
            .ui-layer {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto 1fr auto;
                gap: 10px;
                padding: 12px;
                overflow-y: auto;
            }

            .area-topleft { grid-column: 1; grid-row: 1; }
            .area-topcenter { grid-column: 1; grid-row: 2; }
            .area-topright { grid-column: 1; grid-row: 1; justify-content: flex-end; }
            .area-left { grid-column: 1; grid-row: 3; }
            .area-right { grid-column: 1; grid-row: 3; align-self: end; }
            .area-bottomleft { grid-column: 1; grid-row: 4; }
            .area-bottomright { grid-column: 1; grid-row: 4; justify-content: flex-end; }

            .stats-row { flex-wrap: wrap; justify-content: center; }
            .stat-card { min-width: 90px; padding: 8px 12px; }
            .history-panel { width: 100%; }
            .vehicle-panel { max-height: 40vh; }
            .logo-subtitle { display: none; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="ui-layer">

    <script>
        // ============================================
        // MAP

        const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([11.5564, 104.9282], 13);
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}.png?key=cb1_499a_1_74f214278a9b83544f742ab1', { subdomains: 'abcd', maxZoom: 20, pane: 'overlayPane' }).addTo(map);

        // ============================================
        // DATA
        // ============================================
        const vehicles = {
            'car1': { name: 'ឡាន ០១', color: '#2563eb', icon: '🚚', topic: 'gps/tracker/device01', marker: null, pathLine: null, data: null, lastUpdate: 0, history: [], journeys: [] },
            'car2': { name: 'ឡាន ០២', color: '#dc2626', icon: '🚛', topic: 'gps/tracker/device02', marker: null, pathLine: null, data: null, lastUpdate: 0, history: [], journeys: [] },

        };

        let autoFollow = true;
        let selectedVehicle = null;
        let playbackMarker = null;
        let lastStopTime = {};
        let userMarker = null;
        let userLocation = null;

        const ICONS = {
            truck: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>`,
            location: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>`,

            ruler: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.3 8.7 15.3 2.7a1 1 0 0 0-1.4 0L2.7 13.9a1 1 0 0 0 0 1.4l6 6a1 1 0 0 0 1.4 0L21.3 10.1a1 1 0 0 0 0-1.4Z"/><path d="m7.5 10.5 2 2"/><path d="m10.5 7.5 2 2"/><path d="m13.5 4.5 2 2"/><path d="m4.5 13.5 2 2"/></svg>`,
            check: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
            warning: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
            bell: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>`,
            arrow: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`
        };

        function createCarIcon(color, heading = 0) {
            return L.divIcon({
                className: 'car-marker',
                html: `<div style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 6px 16px rgba(0,0,0,0.35));transform:rotate(${heading}deg);"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="46" height="46"><circle cx="12" cy="12" r="11" fill="${color}" stroke="white" stroke-width="2.5"/><path fill="white" transform="translate(6.5, 6.5) scale(0.46)" d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg></div>`,
                iconSize: [52, 52], iconAnchor: [26, 26]
            });
        }

        function createUserIcon() {
            return L.divIcon({
                className: 'user-marker',
                html: `<div style="position:relative;width:24px;height:24px;"><div style="position:absolute;inset:0;border-radius:50%;background:rgba(59,130,246,0.4);animation:userPulse 2s cubic-bezier(0.22,1,0.36,1) infinite;"></div><div style="position:absolute;inset:0;background:linear-gradient(135deg,#3b82f6,#1d4ed8);border-radius:50%;border:3px solid white;box-shadow:0 0 0 2px rgba(59,130,246,0.3);"></div></div>`,
                iconSize: [24, 24], iconAnchor: [12, 12]
            });
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function formatDistance(km) {
            if (km < 1) return `${Math.round(km * 1000)} m`;
            return `${km.toFixed(1)} km`;
        }

        function formatCoords(lat, lng) {
            return `${parseFloat(lat).toFixed(4)}, ${parseFloat(lng).toFixed(4)}`;
        }

        // ============================================
        // USER LOCATION
        // ============================================
        function initUserLocation() {
            if (!navigator.geolocation) return;

            navigator.geolocation.watchPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    userLocation = { lat, lng };

                    if (!userMarker) {
                        userMarker = L.marker([lat, lng], { icon: createUserIcon(), zIndexOffset: 1000 })
                            .addTo(map)
                            .bindPopup(`<div style="font-family:'Kantumruy Pro',sans-serif;padding:12px 16px;"><div style="font-size:14px;font-weight:700;color:#3b82f6;margin-bottom:6px;">📍 ទីតាំងខ្ញុំ</div><div style="font-size:12px;color:#666;">${formatCoords(lat, lng)}</div></div>`);
                    } else {
                        userMarker.setLatLng([lat, lng]);
                    }

                    updateVehicleList();
                },
                (error) => console.warn('Geolocation error:', error),
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        // ============================================
        // VEHICLE LIST (STANDARD DESIGN)
        // ============================================
        function updateVehicleList() {
            const listEl = document.getElementById('vehicle-list');
            document.getElementById('vehicle-count-badge').textContent = Object.keys(vehicles).length;

            listEl.innerHTML = Object.entries(vehicles).map(([key, v]) => {
                const isOnline = Date.now() - v.lastUpdate < 30000;
                const isSelected = selectedVehicle === key;
                
                let distanceText = '';
                if (userLocation && v.data) {
                    const dist = calculateDistance(userLocation.lat, userLocation.lng, v.data.lat, v.data.lng);
                    distanceText = `<div class="vehicle-card-meta-item distance">${ICONS.location} ${formatDistance(dist)}</div>`;
                }
                
                return `
                    <div class="vehicle-card ${isSelected ? 'selected' : ''}" 
                         style="--vehicle-color: ${v.color};"
                         onclick="selectVehicle('${key}')">
                        <div class="vehicle-card-bar"></div>
                        <div class="vehicle-card-icon ${isOnline ? 'online' : 'offline'}" 
                             style="color: ${v.color};">
                            ${v.icon}
                        </div>
                        <div class="vehicle-card-info">
                            <div class="vehicle-card-name-row">
                                <span class="vehicle-card-name">${v.name}</span>
                                <span class="vehicle-card-status ${isOnline ? 'online' : 'offline'}">
                                    ${isOnline ? 'Online' : 'Offline'}
                                </span>
                            </div>
                            <div class="vehicle-card-meta">
                                <div class="vehicle-card-meta-item">
                                    ${ICONS.clock} ${v.data?.speed || 0} km/h
                                </div>
                                ${distanceText}
                            </div>
                        </div>
                        <div class="vehicle-card-arrow">
                            ${ICONS.arrow}
                        </div>
                    </div>
                `;
            }).join('');

            // Apply active search filter if any
            const searchVal = document.getElementById('vehicle-search').value.toLowerCase();
            if (searchVal) {
                document.querySelectorAll('.vehicle-card').forEach(card => {
                    const name = card.querySelector('.vehicle-card-name').textContent.toLowerCase();
                    card.style.display = name.includes(searchVal) ? 'flex' : 'none';
                });
            }
        }

        // Search Filter Event
        document.getElementById('vehicle-search').addEventListener('input', (e) => {
            const keyword = e.target.value.toLowerCase();
            document.querySelectorAll('.vehicle-card').forEach(card => {
                const name = card.querySelector('.vehicle-card-name').textContent.toLowerCase();
                card.style.display = name.includes(keyword) ? 'flex' : 'none';
            });
        });

        // ============================================
        // SELECT VEHICLE
        // ============================================
        window.selectVehicle = function(key) {
            selectedVehicle = selectedVehicle === key ? null : key;
            
            if (selectedVehicle) {
                const v = vehicles[key];
                if (v.marker) {
                    map.setView(v.marker.getLatLng(), 16);
                    v.marker.openPopup();
                }
                
                if (userLocation && v.data) {
                    const dist = calculateDistance(userLocation.lat, userLocation.lng, v.data.lat, v.data.lng);
                    showNotification(`${v.icon} ${v.name}`, `ចម្ងាយពីអ្នក: ${formatDistance(dist)}`, 'success');
                } else {
                    showNotification(`${v.icon} ${v.name}`, `បានជ្រើសរើសឡាននេះ`, 'success');
                }
            }
            
            updateVehicleList();
        };

        // ============================================
        // POPUP
        // ============================================
        function createPopup(vehicle) {
            const data = vehicle.data;
            if (!data) return '';

            const isOnline = Date.now() - vehicle.lastUpdate < 30000;
            const lastUpdate = new Date(vehicle.lastUpdate).toLocaleTimeString('km-KH');
            const lastDate = new Date(vehicle.lastUpdate).toLocaleDateString('km-KH');

            let distanceInfo = '';
            if (userLocation) {
                const dist = calculateDistance(userLocation.lat, userLocation.lng, data.lat, data.lng);
                distanceInfo = `
                    <div class="info-tile" style="grid-column: span 2;">
                        <div class="info-tile-label">${ICONS.location} ចម្ងាយពីអ្នក</div>
                        <div class="info-tile-value" style="color: var(--brand-600);">${formatDistance(dist)}</div>
                    </div>
                `;
            }

            const recentJourneys = vehicle.journeys.slice(-3).reverse();
            let journeyHtml = '';
            
            if (recentJourneys.length > 0) {
                journeyHtml = `
                    <div class="popup-section">
                        <div class="popup-section-title">${ICONS.route} ប្រវត្តិធ្វើដំណើរ</div>
                        ${recentJourneys.map(j => `
                            <div class="popup-journey" style="border-left-color: ${vehicle.color};">
                                <div class="popup-journey-route">
                                    <span style="color: var(--success);">●</span> ${j.from}
                                    <span style="color: var(--text-tertiary);">→</span>
                                    <span style="color: var(--danger);">●</span> ${j.to}
                                </div>
                                <div class="popup-journey-meta">
                                    <span>⏰ ${j.startTime} -${j.endTime}</span>
                                    <span>📏 ${j.distance} km</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                journeyHtml = `
                    <div class="popup-section">
                        <div class="popup-section-title">${ICONS.route} ប្រវត្តិធ្វើដំណើរ</div>
                        <div class="empty-state" style="padding:16px 10px;">
                            <div class="empty-state-icon" style="width:40px;height:40px;">${ICONS.route}</div>
                            <div class="empty-state-title" style="font-size:12px;">គ្មានទិន្នន័យ</div>
                            <div class="empty-state-text" style="font-size:11px;">រង់ចាំការធ្វើដំណើរ</div>
                        </div>
                    </div>
                `;
            }

            return `
                <div style="font-family:'Kantumruy Pro',sans-serif;">
                    <div class="popup-header" style="background:linear-gradient(135deg, ${vehicle.color}, ${vehicle.color}cc);">
                        <div class="popup-header-icon">${ICONS.truck}</div>
                        <div class="popup-header-text">
                            <div class="popup-title">${vehicle.name}</div>
                            <div class="popup-status">
                                <span class="popup-status-dot" style="background:${isOnline ? '#10b981' : '#ef4444'};"></span>
                                ${isOnline ? 'Online' : 'Offline'}
                            </div>
                        </div>
                    </div>
                    <div class="popup-body">
                        <div class="info-grid">
                            <div class="info-tile">
                                <div class="info-tile-label">${ICONS.location} ទីតាំង</div>
                                <div class="info-tile-value">${formatCoords(data.lat, data.lng)}</div>
                            </div>
                            <div class="info-tile">
                                <div class="info-tile-label">${ICONS.clock} ល្បឿន</div>
                                <div class="info-tile-value">${data.speed || 0} km/h</div>
                            </div>
                            ${distanceInfo}
                        </div>
                        ${journeyHtml}
                    </div>
                    <div class="popup-footer">${ICONS.clock} ធ្វើបច្ចុប្បន្នភាព: ${lastDate} ${lastUpdate}</div>
                </div>
            `;
        }

        // ============================================
        // TOAST
        // ============================================
        function showNotification(title, message, type = 'info') {
            const container = document.getElementById('notifications');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;

            const iconMap = { success: ICONS.check, warning: ICONS.warning, danger: ICONS.warning, info: ICONS.bell };
            const now = new Date().toLocaleTimeString('km-KH');

            toast.innerHTML = `
                <div class="toast-icon">${iconMap[type]}</div>
                <div class="toast-content">
                    <div class="toast-title">${title}</div>
                    <div class="toast-message">${message}</div>
                    <div class="toast-time">${now}</div>
                </div>
            `;

            container.appendChild(toast);
            setTimeout(() => {
                toast.style.transition = 'all 400ms cubic-bezier(0.22, 1, 0.36, 1)';
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(120%) scale(0.9)';
                setTimeout(() => toast.remove(), 400);
            }, 5000);
        }

        // ============================================
        // JOURNEY DETECTION
        // ============================================
        function detectJourney(vehicle, newLat, newLng, speed) {
            const now = Date.now();
            const key = vehicle.name;

            if (!lastStopTime[key]) {
                lastStopTime[key] = { time: now, lat: newLat, lng: newLng, stopped: true };
                return;
            }

            const prev = lastStopTime[key];

            if (prev.stopped && speed > 5) {
                prev.stopped = false;
                prev.startTime = now;
                prev.startLat = newLat;
                prev.startLng = newLng;
                prev.startTimeStr = new Date(now).toLocaleTimeString('km-KH');
                prev.distance = 0;
            }
            else if (!prev.stopped) {
                prev.distance += calculateDistance(prev.lat, prev.lng, newLat, newLng);
                prev.lat = newLat;
                prev.lng = newLng;

                if (speed < 2) {
                    prev.stopped = true;
                    prev.endTime = now;
                    
                    if (prev.distance > 0.01) {
                        vehicle.journeys.push({
                            from: formatCoords(prev.startLat, prev.startLng),
                            to: formatCoords(newLat, newLng),
                            startTime: prev.startTimeStr,
                            endTime: new Date(now).toLocaleTimeString('km-KH'),
                            distance: prev.distance.toFixed(2),
                            startLat: prev.startLat, startLng: prev.startLng,
                            endLat: newLat, endLng: newLng
                        });
                        showNotification(`${vehicle.icon} ${vehicle.name}`, `ធ្វើដំណើរបាន ${prev.distance.toFixed(2)} គីឡូម៉ែត្រ`, 'success');
                    }
                    lastStopTime[key] = { time: now, lat: newLat, lng: newLng, stopped: true };
                }
            }
        }

        function updateJourneyList(vehicle) {
            const listEl = document.getElementById('journey-list');
            
            if (!vehicle || vehicle.journeys.length === 0) {
                listEl.innerHTML = `<div class="empty-state"><div class="empty-state-icon">${ICONS.route}</div><div class="empty-state-title">គ្មានទិន្នន័យ</div><div class="empty-state-text">រង់ចាំការធ្វើដំណើរ</div></div>`;
                return;
            }

            listEl.innerHTML = vehicle.journeys.slice(-10).reverse().map(j => `
                <div class="journey-item" onclick="focusJourney(${j.startLat}, ${j.startLng}, ${j.endLat}, ${j.endLng})">
                    <div class="journey-route">
                        <div class="journey-endpoint"><span class="endpoint-dot start"></span><span class="journey-coords">${j.from}</span></div>
                        <div class="journey-endpoint"><span class="endpoint-dot end"></span><span class="journey-coords">${j.to}</span></div>
                    </div>
                    <div class="journey-meta">
                        <span class="meta-chip">${ICONS.ruler} ${j.distance} km</span>
                        <span class="meta-chip">${ICONS.clock} ${j.startTime}</span>
                    </div>
                </div>
            `).join('');
        }

        window.focusJourney = function(startLat, startLng, endLat, endLng) {
            const bounds = L.latLngBounds([startLat, startLng], [endLat, endLng]);
            map.fitBounds(bounds, { padding: [80, 80] });
        };

        // ============================================
        // HISTORY PLAYBACK
        // ============================================
        document.getElementById('history-btn').onclick = () => {
            const vehicle = selectedVehicle ? vehicles[selectedVehicle] : vehicles['car1'];
            if (vehicle.history.length === 0) { showNotification('គ្មានប្រវត្តិ', 'គ្មានទិន្នន័យប្រវត្តិ', 'warning'); return; }

            const panel = document.getElementById('history-panel');
            panel.classList.toggle('show');

            if (panel.classList.contains('show')) {
                updateJourneyList(vehicle);
                document.getElementById('history-slider').max = vehicle.history.length - 1;
                document.getElementById('history-slider').value = 0;
                if (playbackMarker) map.removeLayer(playbackMarker);
                playbackMarker = L.marker([vehicle.history[0].lat, vehicle.history[0].lng], { icon: createCarIcon('#f59e0b', 0) }).addTo(map);
                updateHistoryPoint(0);
            } else {
                if (playbackMarker) { map.removeLayer(playbackMarker); playbackMarker = null; }
            }
        };

        document.getElementById('close-history').onclick = () => {
            document.getElementById('history-panel').classList.remove('show');
            if (playbackMarker) { map.removeLayer(playbackMarker); playbackMarker = null; }
        };

        document.getElementById('history-slider').oninput = (e) => { updateHistoryPoint(parseInt(e.target.value)); };

        function updateHistoryPoint(index) {
            const vehicle = selectedVehicle ? vehicles[selectedVehicle] : vehicles['car1'];
            const point = vehicle.history[index];
            if (!point) return;
            const latlng = [point.lat, point.lng];
            if (playbackMarker) playbackMarker.setLatLng(latlng);
            map.panTo(latlng);
            document.getElementById('history-info-left').textContent = `${index + 1} / ${vehicle.history.length}`;
            document.getElementById('history-info-right').textContent = new Date(point.timestamp).toLocaleTimeString('km-KH');
            document.getElementById('hist-speed').textContent = point.speed || 0;
            document.getElementById('hist-battery').textContent = (point.battery || '-') + 'V';
            document.getElementById('hist-sats').textContent = point.sats || 0;
        }

        // ============================================
        // MQTT
        // ============================================
        const MQTT_URL = 'wss://b321ca8746df4aaab862879856ff0317.s1.eu.hivemq.cloud:8884/mqtt';
        const MQTT_USER = 'Esp32_Internet';
        const MQTT_PASS = 'esp32_1122';
        const statusEl = document.getElementById('status');
        const statusText = document.getElementById('status-text');

        const client = mqtt.connect(MQTT_URL, {
            username: MQTT_USER, password: MQTT_PASS,
            clientId: 'web-' + Math.random().toString(16).substr(2, 8),
            reconnectPeriod: 3000, connectTimeout: 10000
        });

        client.on('connect', () => {
            statusEl.className = 'status-pill online';
            statusText.textContent = 'Online';
            Object.values(vehicles).forEach(v => client.subscribe(v.topic, { qos: 1 }));
            showNotification('បានភ្ជាប់', 'ភ្ជាប់ទៅ HiveMQ Cloud បានជោគជ័យ', 'success');
        });

        client.on('reconnect', () => { statusEl.className = 'status-pill offline'; statusText.textContent = 'កំពុងភ្ជាប់...'; });
        client.on('error', () => { statusEl.className = 'status-pill offline'; statusText.textContent = 'Offline'; });

        client.on('message', (topic, message) => {
            try {
                const data = JSON.parse(message.toString());
                const lat = parseFloat(data.lat);
                const lng = parseFloat(data.lng);
                if (isNaN(lat) || isNaN(lng) || lat === 0 || lng === 0) return;

                let key = null;
                for (const [k, v] of Object.entries(vehicles)) { if (v.topic === topic) { key = k; break; } }
                if (!key) return;

                const vehicle = vehicles[key];
                const latlng = [lat, lng];
                const speed = parseFloat(data.speed) || 0;

                vehicle.history.push({ lat, lng, speed, battery: data.battery || 0, sats: data.sats || 0, timestamp: Date.now() });
                if (vehicle.history.length > 500) vehicle.history.shift();

                detectJourney(vehicle, lat, lng, speed);

                if (!vehicle.marker) {
                    vehicle.marker = L.marker(latlng, { icon: createCarIcon(vehicle.color, data.heading || 0) }).addTo(map);
                    vehicle.pathLine = L.polyline([], { color: vehicle.color, weight: 4, opacity: 0.85, lineCap: 'round', lineJoin: 'round' }).addTo(map);
                    vehicle.marker.on('click', () => {
                        selectedVehicle = key;
                        updateVehicleList();
                        if (document.getElementById('history-panel').classList.contains('show')) updateJourneyList(vehicle);
                    });
                } else {
                    vehicle.marker.setLatLng(latlng);
                    if (data.heading !== undefined) {
                        const el = vehicle.marker.getElement();
                        if (el) { const inner = el.querySelector('div'); if (inner) inner.style.transform = `rotate(${data.heading}deg)`; }
                    }
                }

                vehicle.data = data;
                vehicle.lastUpdate = Date.now();
                vehicle.marker.bindPopup(createPopup(vehicle), { maxWidth: 340 });
                vehicle.pathLine.addLatLng(latlng);
                
                updateCounters();
                updateVehicleList();

                if (autoFollow && selectedVehicle === key) map.panTo(latlng);
            } catch (e) { console.error(e); }
        });

        function updateCounters() {
            let online = 0, offline = 0;
            Object.values(vehicles).forEach(v => { if (Date.now() - v.lastUpdate < 30000) online++; else offline++; });
            document.getElementById('total-count').textContent = Object.keys(vehicles).length;
            document.getElementById('online-count').textContent = online;
            document.getElementById('offline-count').textContent = offline;
        }

        document.getElementById('locate-btn').onclick = function() {
            if (userLocation) {
                map.setView([userLocation.lat, userLocation.lng], 16);
                if (userMarker) userMarker.openPopup();
                showNotification('📍 ទីតាំងខ្ញុំ', `${formatCoords(userLocation.lat, userLocation.lng)}`, 'success');
            } else {
                initUserLocation();
                showNotification('📍 កំពុងរកទីតាំង', 'សូមអនុញ្ញាតការចូលប្រើទីតាំង', 'info');
            }
        };

        document.getElementById('follow-btn').onclick = function() {
            autoFollow = !autoFollow;
            this.classList.toggle('active', autoFollow);
        };

        document.getElementById('theme-btn').onclick = function() {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            this.querySelector('#theme-icon').innerHTML = isDark 
                ? '<circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>'
                : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        };

        updateCounters();
        updateVehicleList();
        initUserLocation();
        setInterval(() => { updateCounters(); updateVehicleList(); }, 3000);
    </script>
</body>
